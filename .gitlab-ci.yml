stages:
  - lint
  - test
  - build
  - package
  - update-manifest

variables:
  GO_VERSION: "1.25"

lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run ./...

test:
  stage: test
  image: golang:${GO_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  script:
    - go test ./... -v

build:
  stage: build
  image: golang:${GO_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  script:
    - CGO_ENABLED=0 go build -o mcp-task-server ./cmd/server
  artifacts:
    paths:
      - mcp-task-server
    expire_in: 1 hour

package:
  stage: package
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"

update-manifest:
  stage: package
  needs: ["package"]
  image: alpine:latest
  before_script:
    - apk add --no-cache git yq
  script:
    - |
      git config user.email "ci@gitlab.com"
      git config user.name "GitLab CI"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git checkout main
      yq -i ".image.tag = \"${CI_COMMIT_SHORT_SHA}\"" mcp-task-server-chart/values-dev.yaml
      git add mcp-task-server-chart/values-dev.yaml
      git commit -m "ci: bump image tag to ${CI_COMMIT_SHORT_SHA} [skip ci]"
      git push origin main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'