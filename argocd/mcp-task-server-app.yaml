apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-task-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/turisap/k8s-mcp.git
    targetRevision: main
    path: mcp-task-server-chart
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true