apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-task-server
  namespace: mcp-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: mcp.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mcp-task-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-web
                port:
                  number: 80