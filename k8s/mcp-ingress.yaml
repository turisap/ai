apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-task-server
  namespace: mcp-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: mcp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-task-server
            port:
              number: 8080
