apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-task-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcp-task-server
  template:
    metadata:
      labels:
        app: mcp-task-server
    spec:
      containers:
      - name: server
        image: mcp:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
          - name: ADDR
            valueFrom:
              configMapKeyRef:
                name: mcp-task-server-config
                key: ADDR
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: mcp-task-server-secrets
                key: DATABASE_URL
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: mcp-task-server-secrets
                key: REDIS_URL
          - name: MCP_API_KEY
            valueFrom:
              secretKeyRef:
                name: mcp-task-server-secrets
                key: MCP_API_KEY