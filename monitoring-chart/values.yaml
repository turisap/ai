grafana:
  adminPassword: admin
  persistence:
    enabled: true
    size: 1Gi
  ingress:
    host: grafana.local

prometheus:
  retention: 15d
  storage: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

loki-stack:
  grafana:
    enabled: false
  promtail:
    enabled: true
  loki:
    image:
      tag: 2.9.6
    persistence:
      enabled: true
      size: 2Gi